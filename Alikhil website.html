<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Raleway', sans-serif; }
body { overflow:hidden; height:100vh; background:#0f0c29; display:flex; justify-content:center; align-items:center; flex-direction:column; position:relative; touch-action:none; }

/* Particles */
.particle { position:absolute; width: 6px; height:6px; background: rgba(255,255,255,0.3); border-radius:50%; animation: particleAnim 8s linear infinite; z-index:0; }
@keyframes particleAnim { 0% { transform: translateY(0) translateX(0);} 50% { transform: translateY(-120px) translateX(60px);} 100% { transform: translateY(0) translateX(0);} }

/* Rotating radial background */
.background-glow { position:absolute; width:200%; height:200%; top:-50%; left:-50%; background: radial-gradient(circle, #0ff, #7f00ff, #ff00ff); filter:blur(120px); animation: rotateBG 30s linear infinite; z-index:-1; }
@keyframes rotateBG { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

/* Lens flare */
.flare { position:absolute; width:200px; height:200px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.3), transparent); animation: moveFlare 12s infinite alternate; z-index:1; }
@keyframes moveFlare { 0% {transform:translate(0,0);} 50% {transform:translate(100px,50px);} 100% {transform:translate(0,0);} }

/* Profile glow & picture */
.profile-container { position:relative; text-align:center; z-index:2; }
.profile-container::before { content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:220px; height:220px; border-radius:50%; background: radial-gradient(circle, #00c6ff, #7f00ff, #ff00ff); filter:blur(80px); opacity:0.7; z-index:-1; }
.profile img { width:150px; height:150px; border-radius:50%; border:6px solid #00c6ff; box-shadow:0 0 60px #00c6ff,0 0 100px #7f00ff; object-fit:cover; animation: profileFade 1.5s ease forwards;}
@keyframes profileFade { 0% {opacity:0; transform:scale(0.7);} 100% {opacity:1; transform:scale(1);} }

/* Name & Description */
.profile h1 { color:#fff; font-size:28px; margin-top:12px; font-weight:800; text-shadow:0 0 10px #00c6ff,0 0 20px #7f00ff; animation: shimmerText 3s infinite linear; }
.profile p { color:#cfd8dc; margin-top:10px; font-size:16px; line-height:1.6; max-width:320px; margin-left:auto;margin-right:auto; text-shadow:0 0 5px rgba(0,198,255,0.3); animation: floatText 4s ease-in-out infinite alternate; }

/* Text shimmer */
@keyframes shimmerText {
  0% { text-shadow:0 0 5px #00f,0 0 10px #0ff,0 0 20px #7f00ff; }
  50% { text-shadow:0 0 10px #0ff,0 0 20px #7f00ff,0 0 30px #ff0; }
  100% { text-shadow:0 0 5px #00f,0 0 10px #0ff,0 0 20px #7f00ff; }
}
@keyframes floatText { 0% {transform:translateY(0px);} 50% {transform:translateY(-5px);} 100% {transform:translateY(0px);} }

/* Social icons */
.icons { display:flex; gap:25px; margin-top:30px; justify-content:center; flex-wrap:wrap; z-index:2; perspective:1000px; }
.icon { width:75px; height:75px; border-radius:25px; background-size:cover; box-shadow:0 12px 40px rgba(0,0,0,0.5),0 0 25px rgba(0,198,255,0.5); transition: all 0.4s ease; animation: floatIcon 6s ease-in-out infinite alternate; cursor:pointer; opacity:0; transform: translateZ(50px) scale(0); }
.icon:hover { transform: scale(1.5) rotateY(20deg); box-shadow:0 30px 80px rgba(0,198,255,0.9),0 0 50px rgba(0,255,255,0.7); }

/* Icon float */
@keyframes floatIcon { 0%{transform:translateY(0px) scale(1);} 50%{transform:translateY(-20px) scale(1.05);} 100%{transform:translateY(0px) scale(1);} }

/* Footer */
.footer { color:#888; margin-top:25px; font-size:14px; text-shadow:0 0 5px rgba(0,198,255,0.2); }

/* Interactive trail */
.trail { position:absolute; width:10px; height:10px; border-radius:50%; pointer-events:none; background:rgba(0,198,255,0.7); box-shadow:0 0 15px rgba(0,255,255,0.9); }
</style>

<script>
// Particles
const particleCount = 60;
const particlesContainer = document.getElementById('particles');
for(let i=0;i<particleCount;i++){
  const p = document.createElement('div');
  p.className='particle';
  p.style.top = Math.random()*100+'%';
  p.style.left = Math.random()*100+'%';
  p.style.width = (Math.random()*5+2)+'px';
  p.style.height = p.style.width;
  p.style.animationDuration = (Math.random()*8+4)+'s';
  p.style.background = `rgba(255,255,255,${Math.random()*0.5+0.3})`;
  particlesContainer.appendChild(p);
}

// Icon entrance
const icons = document.querySelectorAll('.icon');
icons.forEach((icon,i)=>{
  setTimeout(()=>{ icon.style.opacity=1; icon.style.transform='translateZ(0) scale(1)'; }, i*250);
});

// Device tilt / parallax
if(window.DeviceOrientationEvent){
  window.addEventListener("deviceorientation", function(event){
    let gamma = event.gamma; 
    let beta = event.beta;
    icons.forEach((icon,i)=>{
      icon.style.transform = `translateZ(0) translateX(${gamma/3}px) translateY(${beta/3}px) scale(1)`;
    });
  }, true);
}

// Floating trail on touch/mouse
document.addEventListener("mousemove", e => createTrail(e.clientX,e.clientY));
document.addEventListener("touchmove", e => { createTrail(e.touches[0].clientX,e.touches[0].clientY); });
function createTrail(x,y){
  const t = document.createElement('div'); t.className='trail'; t.style.left=x+'px'; t.style.top=y+'px';
  document.body.appendChild(t);
  setTimeout(()=> t.remove(),500);
}
</script>
